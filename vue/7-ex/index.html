<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会員登録アプリ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 20px;
      color: #1d344e;
      background: #fff;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    .wrap {
      width: min(100%, 580px);
      margin: 0 auto;
      padding: 34px 36px 38px;
      background: #f4f6fa;
      border-radius: 56px;
      box-shadow: 0 2px 2px rgba(0,0,0,.22);
    }
    .todo-form { display: flex; gap: 14px; align-items: stretch; }
    .input-text {
      min-width: 0;
      flex: 1;
      height: 58px;
      padding: 0 24px;
      border: 0;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 3px 2px rgba(0,0,0,.25);
      color: #1d344e;
      font-size: 18px;
      outline-offset: 3px;
    }
    .input-text::placeholder { color: #677381; opacity: 1; }
    .add-button {
      flex: 0 0 126px;
      min-height: 58px;
      border: 0;
      border-radius: 10px;
      background: #98d400;
      box-shadow: 0 3px 2px rgba(0,0,0,.22);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-button:hover { background: #8bc400; }
    .add-button:active { transform: translateY(1px); }
    .list-area { margin-top: 32px; }
    .todo-title {
      margin: 0 0 25px;
      text-align: center;
      font-size: 23px;
      font-weight: 700;
    }
    .member-count { margin: -13px 0 17px; text-align: center; font-size: 15px; }
    .todo-area { margin: 0; padding: 0 7px; list-style: none; }
    .list {
      min-height: 49px;
      display: flex;
      align-items: center;
      margin-bottom: 9px;
      padding: 10px 29px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 3px 2px rgba(0,0,0,.22);
      overflow-wrap: anywhere;
    }
    .list:last-child { margin-bottom: 0; }
    .list-label { font-size: 18px; }
    @media (max-width: 520px) {
      body { padding: 25px 12px; }
      .wrap { padding: 28px 18px 30px; border-radius: 34px; }
      .todo-form { gap: 9px; }
      .input-text { padding: 0 12px; font-size: 15px; }
      .add-button { flex-basis: 80px; font-size: 18px; }
      .todo-area { padding: 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <article class="wrap">
      <section class="todo-form">
        <input
          type="text"
          name="member-name"
          class="input-text"
          placeholder="please enter name"
          :value="name"
          @input="inputName"
          @keydown.enter="addMember"
        />
        <button type="button" class="add-button" @click="addMember">登録</button>
      </section>

      <section class="list-area">
        <div class="area-incomplete">
          <p class="todo-title">登録済み会員</p>
          <p class="member-count">登録人数：{{ members.length }}人</p>
          <ul class="todo-area">
            <li v-for="member in members" :key="member.id" class="list">
              <span class="list-label">{{ member.name }}</span>
            </li>
          </ul>
        </div>
      </section>
    </article>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.11/dist/vue.js"></script>
  <script src="./script/script.js"></script>
</body>
</html>
