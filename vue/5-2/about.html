<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT | Vue.js練習サイト</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div id="app" class="has-background-grey-lighter">
        <div class="tabs">
            <ul>
                <li v-for="(item, i) in menus" :key="i" class="menu-item">
                    <a :href="item.path">
                        <span class="icon is-small">
                            <i :class="item.icon" aria-hidden="true"></i>
                        </span>
                        <span>{{ item.label }}</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <main class="section">
        <div class="container">
            <h1 class="title">このサイトについて</h1>
            <div class="content"><p>このサイトでは、Vue.jsのv-forを使ってメニューを表示しています。</p><p>Bulmaでタブを整え、Font Awesomeでアイコンを付けています。</p></div>
        </div>
    </main>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./script/ex1_script.js"></script>
</body>
</html>
